apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app: auth
    {{- include "example-branch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      {{- if .Values.auth.compute }}
      nodeSelector:
        kindling.dev/compute: {{ .Values.auth.compute | quote }}
      tolerations:
      - key: kindling.dev/compute
        operator: Equal
        value: {{ .Values.auth.compute | quote }}
        effect: NoSchedule
      {{- end }}
      containers:
      - name: auth
        image: {{ .Values.auth.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.auth.port }}
        env:
        {{- if .Values.auth.env.APP_SECRET_KEY }}
        - name: APP_SECRET_KEY
          value: {{ .Values.auth.env.APP_SECRET_KEY | quote }}
        {{- end }}
        {{- if .Values.auth.env.LAB_THINGY_JWT_SECRET }}
        - name: LAB_THINGY_JWT_SECRET
          value: {{ .Values.auth.env.LAB_THINGY_JWT_SECRET | quote }}
        {{- end }}
        - name: AUTH0_DOMAIN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: AUTH0_DOMAIN
        - name: AUTH0_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: AUTH0_CLIENT_ID
        - name: AUTH0_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: AUTH0_CLIENT_SECRET
        - name: MONGO_HOST
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: MONGO_HOST
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: MONGO_USER
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-auth-secrets
              key: MONGO_PASSWORD
