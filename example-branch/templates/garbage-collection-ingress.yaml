{{- if .Values.garbage_collection.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-garbage-collection
  labels:
    app: garbage-collection
    {{- include "example-branch.labels" . | nindent 4 }}
  {{- with .Values.garbage_collection.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.garbage_collection.ingress.ingressClassName }}
  ingressClassName: {{ .Values.garbage_collection.ingress.ingressClassName }}
  {{- end }}
  rules:
  - host: {{ .Values.garbage_collection.ingress.host }}
    http:
      paths:
      - path: {{ .Values.garbage_collection.ingress.path }}
        pathType: {{ .Values.garbage_collection.ingress.pathType }}
        backend:
          service:
            name: {{ .Release.Name }}-garbage-collection
            port:
              number: {{ .Values.garbage_collection.port }}
      {{- range .Values.garbage_collection.ingress.routes }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ .service }}
            port:
              number: {{ .port }}
      {{- end }}
{{- end }}
