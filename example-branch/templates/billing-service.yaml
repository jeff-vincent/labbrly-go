apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-billing
  labels:
    app: billing
    {{- include "example-branch.labels" . | nindent 4 }}
spec:
  selector:
    app: billing
  ports:
  - port: {{ .Values.billing.port }}
    targetPort: {{ .Values.billing.port }}
    protocol: TCP
