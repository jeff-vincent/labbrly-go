apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-llm-proxy
  labels:
    app: llm-proxy
    {{- include "example-branch.labels" . | nindent 4 }}
spec:
  selector:
    app: llm-proxy
  ports:
  - port: {{ .Values.llm_proxy.port }}
    targetPort: {{ .Values.llm_proxy.port }}
    protocol: TCP
