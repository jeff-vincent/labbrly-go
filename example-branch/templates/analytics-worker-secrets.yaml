apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-analytics-worker-secrets
  labels:
    app: analytics-worker
    {{- include "example-branch.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_HOST: {{ .Values.analytics_worker.secrets.MONGO_HOST | quote }}
  MONGO_USER: {{ .Values.analytics_worker.secrets.MONGO_USER | quote }}
  MONGO_PASSWORD: {{ .Values.analytics_worker.secrets.MONGO_PASSWORD | quote }}
