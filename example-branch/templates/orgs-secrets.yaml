apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-orgs-secrets
  labels:
    app: orgs
    {{- include "example-branch.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_HOST: {{ .Values.orgs.secrets.MONGO_HOST | quote }}
  MONGO_USER: {{ .Values.orgs.secrets.MONGO_USER | quote }}
  MONGO_PASSWORD: {{ .Values.orgs.secrets.MONGO_PASSWORD | quote }}
