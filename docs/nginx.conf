server {
  listen 80;
  server_name _;

  # Redirect /docs to /docs/
  location = /docs {
    return 301 /docs/;
  }

  # Serve the Docusaurus build under /docs with SPA fallback
  # Use root so try_files can resolve filesystem paths correctly
  location ^~ /docs/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /docs/index.html;
  }

  # For anything else, return 404
  location / {
    return 404;
  }
}