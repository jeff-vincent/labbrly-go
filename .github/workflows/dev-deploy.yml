name: Dev Deploy

on:
  push:
    branches: [example-branch]
  workflow_dispatch:

env:
  REGISTRY: "registry:5000"
  TAG: "${{ github.actor }}-${{ github.sha }}"

jobs:
  build-and-deploy:
    runs-on: [self-hosted, "${{ github.actor }}"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean builds directory
        shell: bash
        run: |
          rm -f /builds/*.done /builds/*.request /builds/*.processing \
                /builds/*.apply /builds/*.apply-done /builds/*.apply-log \
                /builds/*.apply-exitcode /builds/*.exitcode \
                /builds/*.log /builds/*.dest /builds/*.tar.gz \
                /builds/*.yaml /builds/*.sh /builds/*.dockerfile

      # -- Build all images --
      - name: Build auth image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: auth
          context: ${{ github.workspace }}/auth
          image: "${{ env.REGISTRY }}/auth:${{ env.TAG }}"

      - name: Build analytics image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: analytics
          context: ${{ github.workspace }}/analytics
          image: "${{ env.REGISTRY }}/analytics:${{ env.TAG }}"

      - name: Build analytics-worker image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: analytics-worker
          context: ${{ github.workspace }}/analytics-worker
          image: "${{ env.REGISTRY }}/analytics-worker:${{ env.TAG }}"

      - name: Build billing image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: billing
          context: ${{ github.workspace }}/billing
          image: "${{ env.REGISTRY }}/billing:${{ env.TAG }}"

      - name: Build builder image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: builder
          context: ${{ github.workspace }}/builder
          image: "${{ env.REGISTRY }}/builder:${{ env.TAG }}"

      - name: Build cdn image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: cdn
          context: ${{ github.workspace }}/cdn
          image: "${{ env.REGISTRY }}/cdn:${{ env.TAG }}"

      - name: Build compute image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: compute
          context: ${{ github.workspace }}/compute
          image: "${{ env.REGISTRY }}/compute:${{ env.TAG }}"

      - name: Patch docs Dockerfile for Kaniko
        shell: bash
        run: |
          cd ${{ github.workspace }}/docs
          sed -i '/^FROM node/a ENV npm_config_cache=/tmp/.npm' Dockerfile

      - name: Build docs image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: docs
          context: ${{ github.workspace }}/docs
          image: "${{ env.REGISTRY }}/docs:${{ env.TAG }}"

      - name: Build frontend image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: frontend
          context: ${{ github.workspace }}/frontend
          image: "${{ env.REGISTRY }}/frontend:${{ env.TAG }}"

      - name: Build garbage-collection image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: garbage-collection
          context: ${{ github.workspace }}/garbage-collection
          image: "${{ env.REGISTRY }}/garbage-collection:${{ env.TAG }}"

      - name: Build labs image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: labs
          context: ${{ github.workspace }}/labs
          image: "${{ env.REGISTRY }}/labs:${{ env.TAG }}"

      - name: Build llm-proxy image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: llm-proxy
          context: ${{ github.workspace }}/llm-proxy
          image: "${{ env.REGISTRY }}/llm-proxy:${{ env.TAG }}"

      - name: Build orgs image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: orgs
          context: ${{ github.workspace }}/orgs
          image: "${{ env.REGISTRY }}/orgs:${{ env.TAG }}"

      - name: Build rag-ingest image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: rag-ingest
          context: ${{ github.workspace }}/rag-ingest
          image: "${{ env.REGISTRY }}/rag-ingest:${{ env.TAG }}"

      - name: Build video image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: video
          context: ${{ github.workspace }}/video
          image: "${{ env.REGISTRY }}/video:${{ env.TAG }}"

      # -- Build stock lab environment images (pulled on-demand by compute,
      # not deployed as services) --
      - name: Build python lab env image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: lab-env-python
          context: ${{ github.workspace }}/envs/python
          image: "${{ env.REGISTRY }}/lab-thingy-python:latest"

      - name: Build node lab env image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: lab-env-node
          context: ${{ github.workspace }}/envs/node
          image: "${{ env.REGISTRY }}/lab-thingy-nodejs:latest"

      - name: Build go lab env image
        uses: kindling-sh/kindling/.github/actions/kindling-build@main
        with:
          name: lab-env-go
          context: ${{ github.workspace }}/envs/go
          image: "${{ env.REGISTRY }}/lab-thingy-golang:latest"

      # -- Deploy in dependency order --
      - name: Deploy auth
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-auth"
          image: "${{ env.REGISTRY }}/auth:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-auth.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: auth
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-domain
                  key: AUTH0_DOMAIN
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-m2m-client-id
                  key: AUTH0_M2M_CLIENT_ID
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-m2m-client-secret
                  key: AUTH0_M2M_CLIENT_SECRET
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
          # NOTE: OAuth detected — run 'kindling expose' for a public HTTPS URL
          replicas: "1"

      - name: Deploy analytics
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-analytics"
          image: "${{ env.REGISTRY }}/analytics:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-analytics.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: analytics
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
          dependencies: |
            - type: redis
              shared: true
          replicas: "1"

      - name: Deploy analytics-worker
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-analytics-worker"
          image: "${{ env.REGISTRY }}/analytics-worker:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-analytics-worker.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: analytics-worker
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
          dependencies: |
            - type: redis
              shared: true
          replicas: "1"

      - name: Deploy billing
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-billing"
          image: "${{ env.REGISTRY }}/billing:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-billing.localhost"
          health-check-type: "none"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: billing
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-stripe-api-key
                  key: STRIPE_API_KEY
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
          dependencies: |
            - type: redis
              shared: true
          replicas: "1"

      - name: Deploy builder
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-builder"
          image: "${{ env.REGISTRY }}/builder:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-builder.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: builder
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
          replicas: "1"

      - name: Deploy cdn
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-cdn"
          image: "${{ env.REGISTRY }}/cdn:${{ env.TAG }}"
          port: "80"
          ingress-host: "${{ github.actor }}-cdn.localhost"
          health-check-path: "/"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: cdn
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
          replicas: "1"

      - name: Deploy compute
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-compute"
          image: "${{ env.REGISTRY }}/compute:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-compute.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: compute
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
          dependencies: |
            - type: redis
              shared: true
          replicas: "1"

      - name: Deploy docs
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-docs"
          image: "${{ env.REGISTRY }}/docs:${{ env.TAG }}"
          port: "80"
          ingress-host: "${{ github.actor }}-docs.localhost"
          health-check-path: "/docs/"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: docs
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
          replicas: "1"

      - name: Deploy frontend
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-frontend"
          image: "${{ env.REGISTRY }}/frontend:${{ env.TAG }}"
          port: "80"
          ingress-host: "${{ github.actor }}-frontend.localhost"
          health-check-path: "/"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: frontend
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
          # NOTE: REACT_APP_AUTH0_* vars are inlined into the JS bundle at
          # `npm run build` time via frontend/.env (see frontend/.env.example),
          # not at container runtime, so no secretKeyRefs are needed here.
          # The frontend calls backend APIs via relative same-origin paths
          # (fetch('/orgs/org'), fetch('/labs'), fetch('/auth/demo-token'),
          # etc.), mirroring the production ingress in k8s/templates/frontend.yaml.
          # These routes are merged into this DSE's own managed ingress, so
          # they automatically follow tunnel-host rotation and don't need any
          # separate unmanaged Ingress object (see KINDLING-TODO.md #5).
          routes: |
            - path: /auth
              service: ${{ github.actor }}-auth
              port: 8000
            - path: /orgs
              service: ${{ github.actor }}-orgs
              port: 8000
            - path: /labs
              service: ${{ github.actor }}-labs
              port: 8000
            - path: /compute
              service: ${{ github.actor }}-compute
              port: 8000
            - path: /builder
              service: ${{ github.actor }}-builder
              port: 8000
            - path: /analytics
              service: ${{ github.actor }}-analytics
              port: 8000
            - path: /llm
              service: ${{ github.actor }}-llm-proxy
              port: 8000
            - path: /video
              service: ${{ github.actor }}-video
              port: 8000
          replicas: "1"

