      - name: Deploy rag-ingest
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-rag-ingest"
          image: "${{ env.REGISTRY }}/rag-ingest:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-rag-ingest.localhost"
          health-check-path: "/healthz"
