          image: "${{ env.REGISTRY }}/video:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-video.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: video
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
          replicas: "1"

      - name: Configure frontend API routing ingress
        shell: bash
        run: |
          # The frontend calls the backend APIs via relative same-origin paths
          # (e.g. fetch('/orgs/org'), fetch('/labs'), fetch('/auth/demo-token')),
          # mirroring the production ingress in k8s/templates/frontend.yaml which
          # routes those path prefixes to their respective backend services under
          # a single host. kindling-deploy only wires up one host -> one service
          # per DSE, so we add a supplementary Ingress here with the remaining
          # path-based routes, targeting the same host (tunnel-aware) as the
          # frontend's own ingress.
          #
          # The runner itself has no direct kubectl access — cluster access is
          # only available to the build-agent sidecar via the /builds file-drop
          # protocol (same mechanism kindling-deploy uses for DSE applies and
          # rollout waits), so we drop a script + trigger file for it here.
          BASENAME="/builds/${{ github.actor }}-frontend-routes"
          cat > "${BASENAME}.sh" <<'SCRIPT'
          #!/bin/bash
          set -e
          HOST=$(kubectl get ingress "${{ github.actor }}-frontend" -o jsonpath='{.spec.rules[0].host}')
          echo "Routing backend API paths on host: ${HOST}"
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${{ github.actor }}-frontend-api-routes
            labels:
              app.kubernetes.io/part-of: labbrly
              app.kubernetes.io/component: frontend-api-routes
              apps.example.com/github-username: ${{ github.actor }}
          spec:
            ingressClassName: traefik
            rules:
              - host: ${HOST}
                http:
                  paths:
                    - path: /auth
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-auth
                          port:
                            number: 8000
                    - path: /orgs
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-orgs
                          port:
                            number: 8000
                    - path: /labs
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-labs
                          port:
                            number: 8000
                    - path: /compute
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-compute
                          port:
                            number: 8000
                    - path: /builder
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-builder
                          port:
                            number: 8000
                    - path: /analytics
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-analytics
                          port:
                            number: 8000
                    - path: /llm
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-llm-proxy
                          port:
                            number: 8000
                    - path: /video
                      pathType: Prefix
                      backend:
                        service:
                          name: ${{ github.actor }}-video
                          port:
                            number: 8000
          EOF
          SCRIPT
          chmod +x "${BASENAME}.sh"
          touch "${BASENAME}.kubectl"
          WAITED=0
          while [ ! -f "${BASENAME}.kubectl-done" ]; do
            sleep 1
            WAITED=$((WAITED+1))
            if [ ${WAITED} -ge 60 ]; then
              echo "❌ Timed out waiting for sidecar to configure frontend routing ingress"
              exit 1
            fi
          done
          cat "${BASENAME}.kubectl-log" 2>/dev/null || true
          EXIT_CODE=$(cat "${BASENAME}.kubectl-exitcode" 2>/dev/null || echo "1")
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "❌ Failed to configure frontend API routing ingress"
            exit 1
          fi
          echo "✅ frontend API routing ingress configured"

      - name: Summary
        run: |
          echo "🎉 Deploy complete!"
          echo "🌐 Access your services via their *.localhost ingress hosts."
