            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
