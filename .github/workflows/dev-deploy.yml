      - name: Deploy auth
        uses: kindling-sh/kindling/.github/actions/kindling-deploy@main
        with:
          name: "${{ github.actor }}-auth"
          image: "${{ env.REGISTRY }}/auth:${{ env.TAG }}"
          port: "8000"
          ingress-host: "${{ github.actor }}-auth.localhost"
          health-check-path: "/healthz"
          labels: |
            app.kubernetes.io/part-of: labbrly
            app.kubernetes.io/component: auth
            apps.example.com/github-username: ${{ github.actor }}
          env: |
            - name: APP_SECRET_KEY
              value: "f8d3c7a25e4b9126d7b8935a1e6c4d2f9b8a7c5e1f3d2b4a5c6e7f8a9d0b1c2d"
            - name: LAB_THINGY_JWT_SECRET
              value: "6e4d3c2b1a7988f5e3d2c1b0a9f8e7d6c5b4a392817161514131211100f0e0d"
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-domain
                  key: AUTH0_DOMAIN
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-m2m-client-id
                  key: AUTH0_M2M_CLIENT_ID
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-auth0-m2m-client-secret
                  key: AUTH0_M2M_CLIENT_SECRET
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-host
                  key: MONGO_HOST
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-user
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kindling-secret-mongo-password
                  key: MONGO_PASSWORD
