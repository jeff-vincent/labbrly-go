name: CI - All Branches

on:
  push:
    branches:
      - '**'  # matches all branches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.3.0

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run tests
        run: cd frontend && npm test

      # - name: Build
      #   run: cd frontend && npm run build
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go tests
        run: |
          for svc in shared analytics analytics-worker auth billing builder compute garbage-collection labs llm-proxy orgs video; do
            if [ -d "$svc" ]; then
              echo "Testing $svc..."
              (cd "$svc" && GOWORK=off go test ./... 2>&1) || true
            fi
          done
