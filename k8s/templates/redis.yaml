apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
      labels:
        api: redis
    spec:
      selector:
        matchLabels:
          api: redis
      replicas: 1
      template:
        metadata:
          labels:
            api: redis
        spec:
          containers:
            - name: redis
              image: redis:alpine3.22
              imagePullPolicy: Always
              ports:
                - name: redis
                  containerPort: 6379
                  protocol: TCP
  - apiVersion: v1
    kind: Service
    metadata:
      name: redis
    spec:
      ports:
        - port: 6379
          targetPort: 6379
          name: redis
      selector:
        api: redis
      type: ClusterIP
